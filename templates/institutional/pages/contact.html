{% extends 'institutional/base.html' %}
{% load static %}

{% block content %}
<!-- breadcrumb area start -->
            <section class="breadcrumb__before p-relative">
                <div class="breadcrumb__area overflow-hidden position-relative" data-background="{% static 'institutional/imgs/shapes/breadcrumb-shape.png' %}">
                    <div class="breadcrumb__shapes">
                        <div class="breadcrumb__shapes-shape-1"></div>
                        <div class="breadcrumb__shapes-shape-2"></div>
                        <div class="breadcrumb__shapes-shape-3"></div>
                        <div class="breadcrumb__shapes-shape-4"></div>
                        <div class="breadcrumb__shapes-shape-5 upDown">
                            <img src="{% static 'institutional/imgs/shapes/breadcrumb-shape-1.png' %}" alt="img not found">
                        </div>
                        <div class="breadcrumb__shapes-shape-6 line-to-bottom-360">
                            <img src="{% static 'institutional/imgs/shapes/breadcrumb-shape-2.png' %}" alt="img not found">
                        </div>
                        <div class="breadcrumb__shapes-shape-7 line-to-bottom-360-l">
                            <img src="{% static 'institutional/imgs/shapes/breadcrumb-shape-3.png' %}" alt="img not found">
                        </div>
                        <div class="breadcrumb__shapes-shape-8 leftRight">
                            <img src="{% static 'institutional/imgs/shapes/breadcrumb-shape-4.png' %}" alt="img not found">
                        </div>
                        <div class="breadcrumb__shapes-shape-9">
                            <img src="{% static 'institutional/imgs/shapes/breadcrumb-shape-5.png' %}" alt="img not found">
                        </div>
                    </div>
                    <div class="container">
                        <div class="row align-items-center justify-content-between">
                            <div class="col-12">
                                <div class="breadcrumb__content">
                                    <div class="breadcrumb__title-wrapper">
                                        <h1 class="breadcrumb__title">contact us</h1>
                                    </div>
                                    <div class="breadcrumb__menu">
                                        <nav>
                                            <ul>
                                                <li><span><a href="{% url 'institutional:home' %}"> <img src="{% static 'institutional/imgs/icon/home-icon.png' %}" alt="img not found">Home</a></span></li>
                                                <li class="active"><span>contact us</span></li>
                                            </ul>
                                        </nav>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!--Contact Section-->
            <section class="contact__area section-space">
                <div class="container">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="contact__media">
                                <img src="{% static 'institutional/imgs/images/contato.webp' %}" alt="img not found">
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="contact__title-wrapper">
                                <div class="section__title-wrapper">
                                    <h2 class="section__title-wrapper-title">Get In Touch</h2>
                                </div>
                                <div class="contact__form-wrapper">
                                    <form class="contact__form" id="contact__form" method="POST" action="./mail.php">
                                        <div class="row">
                                            <div class="col-sm-6">
                                                <div class="contact__input">
                                                    <input type="text" placeholder="Your Name">
                                                </div>
                                            </div>
                                            <div class="col-sm-6 p-0-5-20">
                                                <div class="contact__input">
                                                    <input type="email" placeholder="Your Email">
                                                </div>
                                            </div>
                                            <div class="col-sm-6">
                                                <div class="contact__input">
                                                    <input type="number" placeholder="Phone Number">
                                                </div>
                                            </div>
                                            <div class="col-sm-6 p-0-5-20">
                                                <div class="contact__input">
                                                    <input type="tel" placeholder="Subject">
                                                </div>
                                            </div>
                                            <div class="col-12">
                                                <div class="contact__textarea">
                                                    <textarea name="textarea" id="textarea" cols="30" rows="10" placeholder="Write Message..."></textarea>
                                                    <div class="wrap">
                                                        <input type="checkbox" class="form-check-input" id="agree">
                                                        <label class="form-check-label" for="agree">Select to subscribe to our newsletter and updates and we will send you
                                                            all updates about our services.</label>
                                                    </div>
                                                </div>
                                            </div>
                                            <div class="col-12">
                                                <button type="submit" class="rr-btn mt-35">Submit now</button>
                                            </div>
                                        </div>
                                    </form>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <section class="contact-map section-space-bottom">
                <div class="container">
                    <div class="map">
                        <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d14600.157880481716!2d90.35107202273903!3d23.81719545680701!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3755c12c1b289e39%3A0x8d3bdfb80d3ebe88!2sRd%20No.%204%2C%20Dhaka%201216!5e0!3m2!1sen!2sbd!4v1701837409513!5m2!1sen!2sbd" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                    </div>
                </div>
            </section>
{% endblock %}
