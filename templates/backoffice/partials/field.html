{% if field.field.widget.input_type == "checkbox" %}
    <div class="form-check mt-2">
        {{ field }}
        <label class="form-check-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="text-danger">*</span>{% endif %}</label>
    </div>
{% else %}
    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="text-danger">*</span>{% endif %}</label>
    {{ field }}
{% endif %}
{% if field.help_text %}<div class="form-text">{{ field.help_text }}</div>{% endif %}
{% if field.errors %}
    <div class="invalid-feedback d-block">
        {% for error in field.errors %}<div>{{ error }}</div>{% endfor %}
    </div>
{% endif %}
