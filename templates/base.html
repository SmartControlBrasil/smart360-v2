{% load static %}
<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>{% block title %}Smart Control Brasil{% endblock %}</title>
    <meta
        name="description"
        content="{% block meta_description %}Soluções em tecnologia e engenharia.{% endblock %}"
    >

    {% block canonical %}{% endblock %}

    <link rel="stylesheet" href="{% static 'institutional/css/site.css' %}">
</head>
<body>
    <header>
        <a href="{% url 'institutional:home' %}" aria-label="Smart Control Brasil">
            Smart Control Brasil
        </a>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>Smart Control Brasil</p>
    </footer>
</body>
</html>
