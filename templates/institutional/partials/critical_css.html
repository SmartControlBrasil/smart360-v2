{# Critical CSS for the institutional first viewport: preloader, header, mobile menu and home hero. #}
<style>
:root{--rr-ff-heading:'Space Grotesk',sans-serif;--rr-ff-body:'Inter',sans-serif;--rr-common-white:#fff;--rr-common-black:#000;--rr-common-placeholder:#4A5764;--rr-body-primary:#fff;--rr-theme-primary:#FFDA59;--rr-theme-primary2:#8B3DFF;--rr-heading-primary:#050513;--rr-text-body:rgba(5,5,19,.6);--rr-border-primary:1px solid rgba(5,5,19,.14);--rr-background-pastel-blue:#EFF3F6;--rr-fw-normal:normal;--rr-fw-regular:400;--rr-fw-medium:500;--rr-fw-sbold:600;--rr-fw-bold:700;--rr-fs-body:18px;--rr-fs-p:15px;--rr-fs-h1:70px;--rr-fs-h2:44px;--rr-fs-h3:30px;--rr-fs-h4:24px;--rr-fs-h5:20px;--rr-fs-h6:15px;--rr-lh-body:28px;--rr-lh-p:24px;--rr-lh-h1:72px;--rr-lh-h2:56px;--rr-lh-h3:30px;--rr-lh-h4:28px;--rr-lh-h5:32px;--rr-lh-h6:30px}
*{margin:0;padding:0;box-sizing:border-box}
html{font-size:10px}
body{font-family:var(--rr-ff-body);font-size:var(--rr-fs-body);font-weight:normal;color:var(--rr-text-body);line-height:var(--rr-lh-body);background:var(--rr-body-primary);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
h1,.h1,h2,.h2,h3,.h3,h4,.h4,h5,.h5,h6,.h6{font-family:var(--rr-ff-heading);color:var(--rr-heading-primary);margin-top:0;margin-bottom:0;font-weight:var(--rr-fw-bold);word-break:break-word}
h1,.h1{font-size:var(--rr-fs-h1);line-height:var(--rr-lh-h1)}
h2,.h2{font-size:var(--rr-fs-h2);line-height:var(--rr-lh-h2)}
h3,.h3{font-size:var(--rr-fs-h3);line-height:var(--rr-lh-h3)}
h4,.h4{font-size:var(--rr-fs-h4);line-height:var(--rr-lh-h4)}
h5,.h5{font-size:var(--rr-fs-h5);line-height:var(--rr-lh-h5)}

ul{margin:0;padding:0}

a{text-decoration:none;color:inherit;outline:none}

img{width:100%;height:auto;object-fit:cover}

.fix{overflow:hidden}
.p-relative{position:relative}
.z-1{z-index:1}
.heading-bg{background-color:var(--rr-heading-primary)}

.offcanvas-close-icon .offcanvas-m-line.line--2{top:5px}
.offcanvas-close-icon .offcanvas-m-line.line--3{bottom:0}

.main-menu ul{margin-bottom:0}

.banner-heading__wrapper-title{font-family:var(--rr-ff-heading);font-weight:var(--rr-fw-bold);color:var(--rr-common-white);font-size:var(--rr-fs-h1);line-height:var(--rr-lh-h1);font-style:normal;letter-spacing:-.03em;text-transform:inherit;margin-bottom:40px;visibility:visible}

@keyframes img-anim-left{0%{transform:translateX(-5%);clip-path:inset(0 100% 0 0);opacity:0}100%{transform:translateX(0);clip-path:inset(0 0 0 0);opacity:1}}
@keyframes qode-draw{0%,100%{clip-path:inset(-2px 0)}42%{clip-path:inset(-2px 0 -2px 100%)}43%{clip-path:inset(-2px 100% -2px 0)}}

@media only screen and (min-width:992px) and (max-width:1199px){h1,.h1{font-size:52px;line-height:64px}.header{padding:15px 0}.main-menu ul li{margin-inline-end:20px}.main-menu ul li>a{padding:30px 0;font-size:14px}.banner-heading__wrapper-title{font-size:60px;line-height:70px}.banner1__area{margin:0;padding-top:180px}.banner1__thumb{width:100%}}
