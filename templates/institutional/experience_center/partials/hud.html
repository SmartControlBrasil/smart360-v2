<aside class="experience-hud" aria-label="Progresso da experiência">
    <div class="experience-hud__line">
        <span>Pontos</span>
        <strong data-experience-ui="points">0</strong>
    </div>
    <div class="experience-hud__line">
        <span>Nível</span>
        <strong data-experience-ui="level">Explorador</strong>
    </div>
    <div class="experience-hud__meter" aria-label="Experiência do nível atual">
        <span data-experience-ui="xp-label">0 XP</span>
        <div class="experience-hud__bar">
            <span data-experience-ui="xp-bar"></span>
        </div>
    </div>
    <div class="experience-hud__meter" aria-label="Progresso geral">
        <span data-experience-ui="progress-label">0%</span>
        <div class="experience-hud__bar">
            <span data-experience-ui="progress-bar"></span>
        </div>
    </div>
    <p class="experience-hud__saved">Progresso salvo neste navegador enquanto a persistência no banco é preparada.</p>
    <div class="experience-hud__controls">
        <button type="button" data-experience-audio="toggle" data-experience-ui="audio-button">
            Áudio off
        </button>
        <button type="button" data-experience-action="open-missions" data-experience-modal="missions">
            Missões
        </button>
        <button type="button" data-experience-action="reset" data-experience-id="reset-progress">
            Reset
        </button>
    </div>
</aside>
